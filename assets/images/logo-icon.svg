<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A741C"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#FFF5C0"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0D0D0D" stroke="url(#iconGold)" stroke-width="4" />
  <circle cx="100" cy="100" r="85" fill="url(#bgGlow)" />

  <!-- Logo Emblem scaled & centered -->
  <g transform="translate(48, 48) scale(1.1)">
    <path d="M 5 95 L 95 95" stroke="url(#iconGold)" stroke-width="4" stroke-linecap="round" />
    <rect x="15" y="15" width="16" height="75" rx="3" fill="url(#iconGold)" />
    <rect x="20" y="25" width="6" height="55" rx="1.5" fill="#0D0D0D" opacity="0.7" />
    <path d="M 36 50 L 75 15 L 92 15 L 53 50 Z" fill="url(#iconGold)" />
    <path d="M 36 48 L 88 90 L 70 90 L 31 56 Z" fill="url(#iconGold)" />
    <path d="M 55 35 L 75 15 L 75 35 Z" fill="#FFF5C0" opacity="0.4" />
    <polygon points="50,49 55,42 60,49 55,56" fill="url(#iconGold)" />
  </g>
</svg>
